services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MODE: ws
      WEBUI_TOKEN: "fAKvBr5RqnFWPhlgfZOFsOBk8f6pEnlxCuP-1zbjISw"
    ports:
      - "0.0.0.0:6099:6099"
    volumes:
      - /opt/napcat/qq:/app/.config/QQ
      - /opt/napcat/config:/app/napcat/config
      - /opt/napcat/plugins:/app/napcat/plugins
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  insoulforge:
    image: dreamdonghao/insoulforge:latest
    container_name: insoulforge
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      - napcat
    environment:
      TZ: Asia/Shanghai
    ports:
      - "0.0.0.0:7778:7778"
    volumes:
      - /opt/insoulforge/data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
