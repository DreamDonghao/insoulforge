services:
  insoulforge:
    image: dreamdonghao/insoulforge:latest
    container_name: insoulforge
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      TZ: Asia/Shanghai
    ports:
      - "0.0.0.0:7778:7778"
    volumes:
      - /opt/insoulforge/data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
